<!-- Repo path: admin-hub.html
     Root-level control center for every game's admin panel.
     To add a new game once its admin exists: copy one <a class="hub-card">
     line below, change the emoji, name, and href to that game's own
     admin/index.html path. That's the whole process, no other edits needed. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3C Challenge Games — Admin Hub</title>
  <link rel="icon" href="shared/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .hub-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-md);
    }

    .hub-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: var(--brand-neon-gold);
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .hub-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hub-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-lg);
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: var(--transition-normal);
      display: block;
    }

    .hub-card:hover {
      border-color: var(--brand-neon-gold);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="hub-wrap">
    <h1 class="hub-title">Admin Hub</h1>
    <div class="hub-list">
      <a class="hub-card" href="games/maverick-surfboard/admin/index.html">🦆 Maverick Surfboard</a>
      <a class="hub-card" href="games/aurion/admin/index.html">💎 Aurion</a>
      <!-- Add the next one here, same pattern -->
    </div>
  </div>

</body>
</html>
