<!-- Repo path: games/aurion/landing.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurion Challenge — 3C Thread To Success</title>
  <!-- TODO: confirm exact favicon filename saved in /shared -->
  <link rel="icon" href="../../shared/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;700&family=Poppins:wght@400;700&family=Nunito:wght@400;700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="maverick-bg-page">
    <div class="maverick-top-watermark">
      <img src="../../shared/diamond.png" alt="">
      <span>3C Thread To Success</span>
    </div>
    <div class="maverick-screen">
      <img src="assets/aurion-intro.png" alt="Aurion" class="maverick-duck-img">
      <h1 id="landing-title">Aurion</h1>
      <p class="maverick-body-text" id="landing-text">
        Get ready for a new challenge. Every call you make shapes how the story unfolds.
      </p>
      <a href="consent.html" id="continue-link" class="maverick-btn maverick-btn-primary">Continue</a>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var configName = params.get('configName') || 'aurion';
      document.getElementById('continue-link').href = 'consent.html?configName=' + encodeURIComponent(configName);

      // Start warming the browser's cache the instant Landing opens, so by
      // the time the player has clicked through Consent and into the game,
      // every image/video/audio file is already sitting ready, not loading
      // mid-scene. Also pulls the real title through onto this page, which
      // used to just say "PLACEHOLDER" no matter what — fixed here.
      fetch('config/' + encodeURIComponent(configName) + '.json')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (config) {
          if (!config) return;

          if (config.title) {
            document.getElementById('landing-title').textContent = config.title;
          }

          function resolveAssetUrl(url) {
            if (!url) return url;
            if (/^https?:\/\//i.test(url) || url.indexOf('assets/') === 0 || url.indexOf('/') === 0) return url;
            return 'assets/' + url;
          }

          var urls = [];

          function addImg(obj) {
            if (obj && obj.url && obj.type !== 'video') urls.push(resolveAssetUrl(obj.url));
          }

          addImg(config.background);
          (config.decisions || []).forEach(function (d) {
            addImg(d.background);
            if (d.image && d.image.url) urls.push(resolveAssetUrl(d.image.url));
            if (d.overlayImage && d.overlayImage.url) urls.push(resolveAssetUrl(d.overlayImage.url));
          });
          (config.characterImages || []).forEach(function (img) {
            if (img.url) urls.push(resolveAssetUrl(img.url));
          });

          urls.forEach(function (url) {
            var img = new Image();
            img.src = url;
          });

          if (config.ambientSound) {
            var audio = new Audio();
            audio.preload = 'auto';
            audio.src = config.ambientSound;
          }
        })
        .catch(function () { /* preload is best-effort, never block the page for it */ });
    })();
  </script>
</body>
</html>
