<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault door</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14141a; /* CHANGE THIS: page background behind the vault, match your game's palette */
      font-family: 'Montserrat', Arial, sans-serif;
    }

    .vault-stage {
      position: relative;
      width: 90%;
      max-width: 480px;
      aspect-ratio: 3 / 4; /* CHANGE THIS: match your door artwork's actual width:height ratio */
      perspective: 1400px;
      border-radius: 12px;
      overflow: hidden;
    }

    /* What's revealed once the doors swing open — text, image, whatever this week needs */
    .vault-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background-size: cover;
      background-position: center;
    }

    /* Both door halves share this: same full-frame image, positioned to show
       only their half, scaled 2x wide so the crop lines up correctly */
    .vault-door {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background-image: url('door.png'); /* CHANGE THIS: your full-frame closed-door image */
      background-size: 200% 100%;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform 1.1s ease;
    }

    .vault-door-left {
      left: 0;
      background-position: left top;
      transform-origin: left center;
    }

    .vault-door-right {
      right: 0;
      background-position: right top;
      transform-origin: right center;
    }

    .vault-door-left.open  { transform: rotateY(-105deg); }
    .vault-door-right.open { transform: rotateY(105deg); }
  </style>
</head>
<body>

  <div class="vault-stage">
    <div class="vault-reveal">
      <!-- Whatever this week's cue is goes here: text, an image, or both -->
      <p style="color: #fff; font-size: 1rem; margin: 0;">This week's cue appears here</p>
    </div>
    <div class="vault-door vault-door-left" id="doorLeft"></div>
    <div class="vault-door vault-door-right" id="doorRight"></div>
  </div>

  <script>
    var left = document.getElementById('doorLeft');
    var right = document.getElementById('doorRight');
    var opened = false;

    function openVault() {
      if (opened) return;
      opened = true;
      left.classList.add('open');
      right.classList.add('open');
    }

    left.addEventListener('click', openVault);
    right.addEventListener('click', openVault);
  </script>

</body>
</html>
